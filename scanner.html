<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>受付QR読取</title><style>
:root{--blue:#1565d8;--cyan:#13b6d1;--pink:#e65ca8;--green:#20a56b;--orange:#e99724;--line:#dfe7f1;--ink:#18324b;--muted:#718395;--soft:#f5f9fd}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#fff;color:var(--ink)}
.wrap{max-width:760px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0 16px}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.logo{width:46px;height:46px;object-fit:contain;border-radius:50%;background:#fff}.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:#edf5ff;color:var(--blue);font-size:12px;font-weight:900}
.card{border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 8px 24px rgba(30,70,110,.06);background:#fff}.hero{text-align:center;padding:26px 18px}.hero .logo{width:108px;height:108px;box-shadow:0 0 0 10px #f1f7ff}
h1,h2,h3{margin-top:0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.menu{display:block;text-decoration:none;color:var(--ink);text-align:center;padding:20px 10px;border:1px solid var(--line);border-radius:20px}.ico{font-size:31px;color:var(--blue);margin-bottom:7px}.menu small{display:block;color:var(--muted);margin-top:4px}
.btn{display:inline-block;border:0;text-decoration:none;border-radius:14px;padding:13px 16px;font-weight:900;font-size:15px;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#edf3f8;color:var(--ink)}.success{background:var(--green);color:#fff}.danger{background:#fff0f0;color:#b83232}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.appt{border-bottom:1px solid var(--line);padding:14px 0}.appt:last-child{border:0}.when{font-weight:900}.status{font-weight:900}.waiting{color:var(--orange)}.arrived{color:var(--green)}
.qr{width:190px;height:190px;margin:20px auto;background:repeating-conic-gradient(#17324a 0 25%,white 0 50%) 50%/28px 28px;border:14px solid white;outline:1px solid var(--line);position:relative}.qr img{position:absolute;width:54px;height:54px;object-fit:contain;background:#fff;border-radius:50%;padding:3px;left:54px;top:54px}
.metric{padding:15px;border:1px solid var(--line);border-radius:18px;text-align:center}.metric b{font-size:28px;display:block}.table{width:100%;border-collapse:collapse;min-width:620px}.table th,.table td{padding:12px 8px;border-bottom:1px solid var(--line);text-align:left}.pill{padding:5px 9px;border-radius:999px;font-size:12px;font-weight:900;background:#f1f5f8}.pill.ok{background:#e9f8f0;color:var(--green)}.pill.wait{background:#fff6e6;color:#a96a00}
.notice{background:#f1f7ff;border-left:4px solid var(--blue);padding:12px 14px;border-radius:12px}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;position:sticky;bottom:8px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:18px;padding:7px;margin-top:18px}.nav a{text-align:center;text-decoration:none;color:var(--muted);font-size:12px;padding:8px 2px}.nav a.active{color:var(--blue);font-weight:900}
@media(max-width:520px){.wrap{padding:13px}.card{padding:15px;border-radius:18px}.grid{grid-template-columns:1fr 1fr}.row.mobile-stack{align-items:flex-start;flex-direction:column}}
</style><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png"></head><body><div class="wrap"><div class="top"><div class="brand"><img class="logo" src="shibataya-emblem.png"><div>柴田屋整形外科<br><small class="muted">OZ WORKFLOW DEMO</small></div></div><span class="tag">v0.6</span></div>
<div class="row"><a class="btn secondary" href="qr_D0001.html">← 患者画面</a><h2>受付スキャナー</h2><span class="tag">職員側</span></div>
<div class="card" style="text-align:center"><div class="ico" style="font-size:54px;color:var(--cyan)">▦</div><h2>QRを読み取りました</h2><p class="muted">デモではカメラの代わりにD0001を読み取った状態を再現しています。</p></div>
<div class="card"><div class="row"><span>患者</span><b>D0001　山田 太郎</b></div><hr style="border:0;border-top:1px solid var(--line)"><div class="row"><span>予約</span><b>09:00–09:20 / PT A</b></div></div>
<button class="btn success" style="width:100%" onclick="arrive('D0001')">✓ 来院受付を確定する</button>
</div><script>
const KEY='shibataya_v06_state';
const defaults={
 D0001:{name:'山田 太郎',time:'09:00–09:20',pt:'PT A',status:'waiting'},
 D0002:{name:'佐藤 花子',time:'09:20–09:40',pt:'PT A',status:'waiting'},
 D0003:{name:'鈴木 一郎',time:'10:00–10:20',pt:'PT B',status:'waiting'},
 D0004:{name:'高橋 美咲',time:'11:00–11:20',pt:'PT C',status:'waiting'}
};
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch(e){return JSON.parse(JSON.stringify(defaults))}}
function save(s){localStorage.setItem(KEY,JSON.stringify(s))}
function arrive(id){let s=load();s[id].status='arrived';s[id].arrivedAt=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});save(s);location.href='checkin_done.html?id='+id}
function resetDemo(){localStorage.removeItem(KEY);location.reload()}
function countArrived(){return Object.values(load()).filter(x=>x.status==='arrived').length}
</script></body></html>
