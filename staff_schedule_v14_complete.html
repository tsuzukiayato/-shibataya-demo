<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>柴田屋OZ v1.4 COMPLETE</title>
<style>
:root{--ink:#17324b;--muted:#718395;--blue:#1478e8;--sky:#42c6eb;--line:#dce8f1;--yellow:#fff36b;--red:#d6424d;--care:#176bd4}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--ink);background:linear-gradient(#f7fcff,#fff);padding-bottom:84px}
header{position:sticky;top:0;z-index:20;background:#fffffff2;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:10px 12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:950} .oz{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--sky));color:#fff;font-weight:1000;box-shadow:0 0 0 6px #eaf6ff}
.small{font-size:12px;color:var(--muted)} main{padding:10px;max-width:720px;margin:auto}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:13px;margin:10px 0;box-shadow:0 8px 25px #1b658b0b}
.datebar,.staffs{display:flex;gap:7px;overflow:auto;scrollbar-width:none}
button,.btn{border:0;border-radius:13px;padding:10px 13px;font-weight:900;background:#edf4f9;color:var(--ink)} .staffs button{white-space:nowrap} .staffs button.on{background:linear-gradient(135deg,var(--blue),var(--sky));color:#fff}
.sectiontitle{display:flex;justify-content:space-between;align-items:center;margin:14px 3px 7px} .sectiontitle b{font-size:17px}
.slot{display:grid;grid-template-columns:58px 1fr 28px;gap:8px;align-items:center;min-height:58px;border-top:1px solid #edf2f6;padding:7px 2px} .slot:first-child{border-top:0}
.time{font-weight:950;color:#0e64b4} .box{min-height:43px;border-radius:13px;padding:7px 10px;background:#f7fafc;border:1px solid #edf1f4}
.box.empty{color:#9aa9b5} .box.closed{background:repeating-linear-gradient(45deg,#f8fafb,#f8fafb 8px,#74838f 9px,#74838f 11px);font-weight:900}
.box.phys{background:var(--yellow);font-weight:900} .name{font-weight:950} .care{color:var(--care)} .bundle{color:var(--red)} .chev{font-size:22px;color:#9aabb8}
.search{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;font:inherit} .result{padding:12px;border-bottom:1px solid #edf2f6;cursor:pointer} .result:last-child{border-bottom:0}
.badge{font-size:11px;border-radius:99px;background:#eef4f8;padding:4px 7px} .shiftrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #edf2f6}
.shiftrow select{max-width:205px;padding:9px;border:1px solid var(--line);border-radius:11px;background:#fff}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fffffff4;backdrop-filter:blur(15px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom))}
.bottom button{background:none;padding:7px;color:#6f8292} .bottom button.on{color:var(--blue)}
.modalbg{display:none;position:fixed;inset:0;background:#10253699;z-index:50;align-items:flex-end} .modalbg.show{display:flex}
.sheet{width:100%;max-height:88vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:17px 15px calc(20px + env(safe-area-inset-bottom))}
.handle{width:44px;height:5px;border-radius:99px;background:#d9e2e8;margin:0 auto 14px} .choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice button{padding:14px 8px;border:1px solid var(--line);background:#f7fafc} .choice .yellow{background:var(--yellow)} .manual{font-size:9px;color:#ff7b00}
.notice{padding:10px 12px;border-left:4px solid var(--blue);background:#eef8ff;border-radius:11px;margin:10px 0}
</style>
</head>
<body>
<header><div class="brand"><div class="oz">OZ</div><div>柴田屋整形外科<div class="small">OZ STAFF SYSTEM v1.4 COMPLETE</div></div></div></header>
<main>
<div class="card"><div class="datebar"><button disabled>‹ 前日</button><button style="background:#1478e8;color:#fff">10月1日（木）</button><button disabled>翌日 ›</button></div></div>

<section id="ptview">
<div class="notice">PT別の20分予約表です。枠をタップして予約・物療・閉鎖・シフト設定への復帰を操作できます。</div>
<div class="card"><div class="small">担当PT</div><div id="staffs" class="staffs"></div></div>
<div id="schedule"></div>
</section>

<section id="searchview" style="display:none">
<div class="card">
<h2 style="margin-top:0">患者検索 <span class="small">v1.4</span></h2>
<div class="small">数字だけを入力した場合は患者番号の完全一致。氏名は部分一致です。</div>
<input id="search" class="search" inputmode="search" autocomplete="off" placeholder="患者名 / 患者番号">
<div id="searchcount" class="small" style="margin:10px 0"></div>
<div id="results"></div>
</div>
</section>

<section id="shiftview" style="display:none">
<div class="card"><h2 style="margin-top:0">今日のシフト</h2><div class="small">変更は予約表へ即時反映します。</div><div id="shiftlist"></div></div>
</section>
</main>

<nav class="bottom">
<button id="navpt" class="on" onclick="view('pt')">▦<br>予約</button>
<button id="navsearch" onclick="view('search')">⌕<br>患者</button>
<button id="navshift" onclick="view('shift')">◫<br>シフト</button>
</nav>

<div id="slotmodal" class="modalbg" onclick="if(event.target===this)closeSlot()"><div class="sheet"><div class="handle"></div><h3 id="slottitle"></h3><div id="slotstatus" class="small"></div><div style="height:12px"></div><div class="choice">
<button onclick="choosePatient()">＋ 患者を予約</button>
<button class="yellow" onclick="slotAct('phys')">物療にする</button>
<button onclick="slotAct('closed')">枠を閉じる</button>
<button onclick="slotAct('normal')">通常枠にする</button>
<button onclick="removeBooking()">予約を取消</button>
<button onclick="slotAct('base')">シフト設定に戻す</button>
</div></div></div>

<div id="patientmodal" class="modalbg" onclick="if(event.target===this)closePatient()"><div class="sheet"><div class="handle"></div><h3>この枠に予約</h3>
<input id="psearch" class="search" inputmode="search" autocomplete="off" placeholder="患者名 / 患者番号" oninput="renderPicker()"><div id="picker"></div></div></div>

const KEY="shibataya_v14_complete";
function fresh(){
  const shift={}; STAFF.forEach(s=>shift[s]="normal");
  shift["本院"]="phys"; shift["松田"]="full"; shift["山梨"]="pmoff"; shift["増田"]="600";
  return {date:"2026-10-01",shift,override:{},slotOverride:{},slots:{}};
}
let D;
try{D=JSON.parse(localStorage.getItem(KEY)||"null")||fresh();}catch(e){D=fresh();}
D.shift=D.shift||fresh().shift; D.override=D.override||{}; D.slotOverride=D.slotOverride||{}; D.slots=D.slots||{};
let current="山口", edit=null;
function save(){localStorage.setItem(KEY,JSON.stringify(D));}
function norm(v){return String(v??"").trim().toLowerCase().replace(/\s+/g,"");}
function searchPatients(query){
  const raw=String(query??"").trim();
  if(!raw) return [];
  const q=norm(raw);
  if(/^\d+$/.test(raw)) {
    const exact=PATIENTS.find(p=>String(p.id)===raw);
    return exact?[exact]:[];
  }
  return PATIENTS.filter(p=>norm(p.name).includes(q)).slice(0,50);
}
function label(t){return t==="care"?"介護":t==="bundle"?"まとめ":"一般";}
function effective(s){return D.override[s]||D.shift[s]||"normal";}
function baseState(s,t){
  const x=effective(s),h=parseInt(t,10);
  if(x==="full"||(x==="amoff"&&h<15)||(x==="pmoff"&&h>=15)||(x==="600"&&h>=18)) return "closed";
  if(x==="phys"||(x==="physam"&&h<15)||(x==="physpm"&&h>=15)) return "phys";
  return "normal";
}
function slotState(s,t){return D.slotOverride[t+"|"+s]||baseState(s,t);}
function renderStaffs(){document.getElementById("staffs").innerHTML=STAFF.map(s=>`<button class="${s===current?"on":""}" onclick="current='${s}';renderStaffs();renderSchedule()">${s}</button>`).join("");}
function section(title,times){return `<div class="sectiontitle"><b>${title}</b><span class="small">${current}</span></div><div class="card">${times.map(slotHtml).join("")}</div>`;}
function slotHtml(t){
  const k=t+"|"+current, st=slotState(current,t), x=D.slots[k], manual=Object.prototype.hasOwnProperty.call(D.slotOverride,k);
  let body;
  if(st==="closed") body=`<div class="box closed">閉鎖</div>`;
  else if(st==="phys") body=`<div class="box phys">物療担当・直接予約不可</div>`;
  else if(x) body=`<div class="box"><div class="name ${x.t}">${x.name}</div><div class="small">#${x.id} / ${label(x.t)}</div></div>`;
  else body=`<div class="box empty">空き</div>`;
  return `<div class="slot" onclick="openSlot('${t}')"><div class="time">${t}${manual?'<div class="manual">手動</div>':""}</div>${body}<div class="chev">›</div></div>`;
}
function renderSchedule(){document.getElementById("schedule").innerHTML=section("午前",AM)+section("午後",PM);}
function openSlot(t){
  edit={s:current,t,k:t+"|"+current};
  const b=baseState(current,t), st=slotState(current,t);
  document.getElementById("slottitle").textContent=current+" "+t;
  document.getElementById("slotstatus").textContent="シフト由来："+stateLabel(b)+" ／ 現在："+stateLabel(st);
  document.getElementById("slotmodal").classList.add("show");
}
function stateLabel(v){return v==="closed"?"閉鎖":v==="phys"?"物療":"通常";}
function closeSlot(){document.getElementById("slotmodal").classList.remove("show");}
function slotAct(v){
  if(!edit)return;
  if(v==="base") delete D.slotOverride[edit.k]; else D.slotOverride[edit.k]=v;
  save(); closeSlot(); renderSchedule();
}
function removeBooking(){if(!edit)return; delete D.slots[edit.k]; save(); closeSlot(); renderSchedule();}
function choosePatient(){
  if(!edit)return; closeSlot();
  document.getElementById("psearch").value="";
  document.getElementById("picker").innerHTML='<div class="small" style="padding:12px">患者番号または氏名を入力してください。</div>';
  document.getElementById("patientmodal").classList.add("show");
  setTimeout(()=>document.getElementById("psearch").focus(),50);
}
function closePatient(){document.getElementById("patientmodal").classList.remove("show");}
function renderPicker(){
  const matches=searchPatients(document.getElementById("psearch").value);
  document.getElementById("picker").innerHTML=matches.length?matches.map(p=>`<div class="result" onclick="book('${p.id}')"><b>${p.name}</b> <span class="badge">${label(p.t)}</span><div class="small">患者番号 ${p.id}</div></div>`).join(""):'<div class="small" style="padding:12px">該当する患者が見つかりません。</div>';
}
function book(id){
  const p=PATIENTS.find(x=>x.id===id); if(!p||!edit)return;
  D.slots[edit.k]={id:p.id,name:p.name,t:p.t};
  D.slotOverride[edit.k]="normal";
  save(); closePatient(); renderSchedule();
}
function renderSearch(){
  const q=document.getElementById("search").value;
  const matches=searchPatients(q);
  const count=document.getElementById("searchcount"), out=document.getElementById("results");
  if(!String(q).trim()){count.textContent=`登録患者 ${PATIENTS.length}名`;out.innerHTML='<div class="small" style="padding:12px">患者番号または氏名を入力してください。</div>';return;}
  count.textContent=`検索結果 ${matches.length}件`;
  out.innerHTML=matches.length?matches.map(p=>`<div class="result"><b>${p.name}</b> <span class="badge">${label(p.t)}</span><div class="small">患者番号 ${p.id}</div></div>`).join(""):'<div class="small" style="padding:12px">該当する患者が見つかりません。</div>';
}
function desc(x){return {normal:"通常",full:"全日休み",amoff:"午前休み",pmoff:"午後休み","600":"600（18時上がり）",phys:"終日物療",physam:"午前のみ物療",physpm:"午後のみ物療"}[x]||x;}
function renderShift(){
 const opts=[["normal","通常"],["full","全日休み"],["amoff","午前休み"],["pmoff","午後休み"],["600","600（18時上がり）"],["phys","終日物療"],["physam","午前のみ物療"],["physpm","午後のみ物療"]];
 document.getElementById("shiftlist").innerHTML=STAFF.map(s=>`<div class="shiftrow"><b>${s}</b><select onchange="setShift('${s}',this.value)">${opts.map(o=>`<option value="${o[0]}" ${o[0]===D.shift[s]?"selected":""}>${o[1]}</option>`).join("")}</select></div>`).join("");
}
function setShift(s,v){D.shift[s]=v;delete D.override[s];save();renderShift();renderSchedule();}
function view(v){
 ["pt","search","shift"].forEach(x=>{document.getElementById(x+"view").style.display=x===v?"block":"none";document.getElementById("nav"+x).classList.toggle("on",x===v);});
 if(v==="shift")renderShift(); if(v==="search")renderSearch();
}
document.addEventListener("DOMContentLoaded",()=>{
 renderStaffs();renderSchedule();renderShift();
 document.getElementById("search").addEventListener("input",renderSearch);
});
</script>
</body></html>
