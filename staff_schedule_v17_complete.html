function todaysBookings(){return Object.entries(D.book).filter(([k,b])=>k.startsWith(D.date+"|")).map(([k,b])=>{let a=k.split("|"),p=pat(b.patientId);return{k,time:a[1],staff:a[2],b,p,status:D.status[k]||"reserved"}}).filter(x=>x.p).sort((a,b)=>a.time.localeCompare(b.time)||a.staff.localeCompare(b.staff,"ja"))}function setStatus(k,v){D.status[k]=v;save();renderToday();renderReport()}function renderToday(){if(typeof todayList==="undefined")return;let d=new Date(D.date+"T00:00:00"),xs=todaysBookings();todayDate.textContent=d.toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"short"});todayCount.textContent=xs.filter(x=>x.status!=="cancel").length;arrivedCount.textContent=xs.filter(x=>x.status==="arrived").length;cancelCount.textContent=xs.filter(x=>x.status==="cancel").length;todayList.innerHTML=xs.length?xs.map(x=>`<div class="todayitem ${x.status==="arrived"?"arrived":""} ${x.status==="cancel"?"cancelled":""}"><b>${x.time}–${x.b.duration===40?nxt(x.time)||"":nxt(x.time)||""}</b><div><b>${esc(x.p.name)}</b><div class=muted>#${x.p.id} / ${lab(x.p.type)} / ${x.staff} / ${x.b.duration}分</div></div><div class=statusbtns><button class="btn ${x.status==="reserved"?"on":""}" onclick="setStatus('${x.k}','reserved')">予約</button><button class="btn ${x.status==="arrived"?"primary":""}" onclick="setStatus('${x.k}','arrived')">来院</button><button class="btn danger" onclick="setStatus('${x.k}','cancel')">取消</button></div></div>`).join(""):"<div class=muted>この日の予約はありません。</div>"}function renderReport(){if(typeof reportList==="undefined")return;let xs=todaysBookings(),valid=xs.filter(x=>x.status!=="cancel"),arr=xs.filter(x=>x.status==="arrived"),can=xs.filter(x=>x.status==="cancel");reportBooked.textContent=valid.length;reportArrived.textContent=arr.length;reportCancel.textContent=can.length;reportList.innerHTML=arr.length?arr.map(x=>`<div class="todayitem arrived"><b>${x.time}</b><div><b>${esc(x.p.name)}</b><div class=muted>#${x.p.id} / ${x.staff} / ${x.b.duration}分</div></div><span>来院済み</span></div>`).join(""):"<div class=muted>まだ来院受付はありません。</div>";reportText.textContent=`本日の予約${valid.length}名のうち、現在${arr.length}名が来院済みです。キャンセルは${can.length}名です。`;}function days(){let[y,m]=D.month.split("-").map(Number),n=new Date(y,m,0).getDate();return Array.from({length:n},(_,i)=>D.month+"-"+String(i+1).padStart(2,"0"))}function renderShift(){let ds=days();mt.textContent=D.month.replace("-","年")+"月";shift.innerHTML=`<tr><th>PT</th>${ds.map(d=>`<th>${+d.slice(-2)}<br>${"日月火水木金土"[new Date(d+"T00:00:00").getDay()]}</th>`).join("")}</tr>`+STAFF.map(s=>`<tr><th>${s}</th>${ds.map(d=>`<td><select onchange="setShift('${d}','${s}',this.value)">${OP.map(o=>`<option value="${o[0]}" ${sh(d,s)===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select></td>`).join("")}</tr>`).join("")}function setShift(d,s,v){D.shifts[SK(d,s)]=v;save();if(d===D.date)renderBoard()}function mvmonth(n){let[y,m]=D.month.split("-").map(Number),d=new Date(y,m-1+n,1);D.month=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");save();renderShift()}function tab(x){boardv.style.display=x==="board"?"":"none";shiftv.style.display=x==="shift"?"":"none";todayv.style.display=x==="today"?"":"none";reportv.style.display=x==="report"?"":"none";tb.classList.toggle("on",x==="board");ts.classList.toggle("on",x==="shift");tt.classList.toggle("on",x==="today");tr.classList.toggle("on",x==="report");if(x==="shift")renderShift();if(x==="today")renderToday();if(x==="report")renderReport()}function closeM(id){document.getElementById(id).classList.remove("show")}
function dragStart(e,el){e.preventDefault();e.stopPropagation();let r=el.getBoundingClientRect();drag={from:el.dataset.k,b:D.book[el.dataset.k]};g=el.cloneNode(true);g.classList.add("ghost");g.style.width=r.width+"px";g.style.height=r.height+"px";document.body.appendChild(g);gm(e);document.addEventListener("pointermove",gm);document.addEventListener("pointerup",dragEnd,{once:true})}function gm(e){if(g){g.style.left=e.clientX+"px";g.style.top=e.clientY+"px"}}function dragEnd(e){document.removeEventListener("pointermove",gm);let x=document.elementFromPoint(e.clientX,e.clientY),td=x&&x.closest(".slot");if(td)moveB(td.dataset.s,td.dataset.t);if(g)g.remove();g=null;drag=null}function moveB(s,t){if(!drag)return;let to=K(s,t);if(to===drag.from)return;if(state(s,t)!=="normal"||D.book[to]||cont(s,t))return alert("移動先は使用できません。");if(drag.b.duration===40&&!can40(s,t,drag.from))return alert("40分の連続枠がありません。");delete D.book[drag.from];let sv=D.status[drag.from];delete D.status[drag.from];D.book[to]=drag.b;if(sv)D.status[to]=sv;save();renderBoard()}
