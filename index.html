<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>柴田屋整形外科 患者ポータル Demo</title><style>
:root{--blue:#1565d8;--cyan:#14b8d4;--pink:#e85aa5;--green:#21a66b;--line:#dfe7f1;--ink:#18324b;--muted:#6f8294;--bg:#f7fafc}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#fff;color:var(--ink)}
.wrap{max-width:760px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;padding:10px 0 18px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900}.mark{width:42px;height:42px;border:2px solid var(--blue);border-radius:50%;display:grid;place-items:center;color:var(--blue)}
.card{border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0;background:#fff;box-shadow:0 8px 25px rgba(26,70,110,.06)}
.hero{text-align:center;padding:28px 16px}.orbit{width:96px;height:96px;border:2px solid var(--blue);border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;font-size:35px;color:var(--blue);box-shadow:0 0 0 10px #f1f7ff}
h1,h2,h3{margin-top:0}.muted{color:var(--muted)}.tag{display:inline-block;background:#edf5ff;color:var(--blue);padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.menu{display:block;text-decoration:none;color:var(--ink);text-align:center;padding:22px 12px;border:1px solid var(--line);border-radius:22px}
.ico{font-size:32px;color:var(--blue);margin-bottom:8px}.menu small{display:block;color:var(--muted);margin-top:5px}
.btn{display:inline-block;text-decoration:none;border:0;border-radius:14px;padding:13px 16px;font-weight:800}.primary{background:var(--blue);color:white}.secondary{background:#eef4fa;color:var(--ink)}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:sticky;bottom:8px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:18px;padding:7px;margin-top:20px}.nav a{text-decoration:none;color:var(--muted);text-align:center;padding:9px 3px;font-size:12px}.nav a.active{color:var(--blue);font-weight:900}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.appt{padding:14px 0;border-bottom:1px solid var(--line)}.when{font-weight:900}
.exercise{display:grid;grid-template-columns:42px 1fr 42px;gap:10px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.num{width:34px;height:34px;border-radius:50%;background:#edf5ff;color:var(--blue);display:grid;place-items:center;font-weight:900}
.qr{width:190px;height:190px;margin:20px auto;background:repeating-conic-gradient(#17324a 0 25%,white 0 50%) 50%/28px 28px;border:14px solid white;outline:1px solid var(--line)}
.patient{display:block;padding:14px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:16px;margin:8px 0}.patient:hover{border-color:var(--blue)}
@media(max-width:520px){.wrap{padding:14px}.grid{grid-template-columns:1fr 1fr}.card{border-radius:18px;padding:15px}}

.brand-emblem{width:46px;height:46px;object-fit:contain;border-radius:50%;background:#fff}
.hero-logo{width:112px;height:112px;padding:5px;border:1px solid var(--line);box-shadow:0 0 0 10px #f1f7ff}
.loginbox{max-width:520px;margin:0 auto}.field{width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:14px;font:inherit;margin:6px 0 12px;background:#fff;color:var(--ink)}
.login-note{font-size:13px;color:var(--muted);line-height:1.55}.brandword{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:800}
</style><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png"></head><body><div class="wrap">
<div class="top"><div class="logo"><img class="brand-emblem" src="shibataya-emblem.png" alt="柴田屋整形外科エンブレム"><div>柴田屋整形外科<br><span class="brandword">PATIENT PORTAL</span></div></div><span class="tag">DEMO v0.5</span></div>
<div class="card hero loginbox"><img class="brand-emblem hero-logo" src="shibataya-emblem.png" alt="柴田屋整形外科エンブレム"><h1 style="margin-top:24px">患者ポータル</h1><p class="muted">予約確認・来院QR・ご自宅での運動をひとつに。</p></div>
<div class="card loginbox"><h2>デモログイン</h2><label><b>患者ID</b></label><input class="field" value="D0001" readonly><label><b>デモコード</b></label><input class="field" value="1234" readonly><a class="btn primary" style="display:block;text-align:center;margin-top:8px" href="home_D0001.html">D0001としてログイン</a><p class="login-note">これは操作確認用の公開デモです。患者ID・氏名・予約・運動内容はすべて架空データです。実際の患者情報は入力しないでください。</p></div>
<div class="card loginbox"><div class="row"><div><b>ほかの架空患者も試す</b><div class="muted">4名のダミーデータを切り替えられます</div></div><a class="btn secondary" href="demo.html">患者一覧</a></div></div>
</div></body></html>
