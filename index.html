const KEY="shibataya_v17_future_complete";
function fresh(){const shift={};STAFF.forEach(s=>shift[s]="normal");shift["本院"]="phys";shift["松田"]="full";shift["山梨"]="pmoff";shift["増田"]="600";return{shift,override:{},slotOverride:{},slots:{}}}
let D;try{D=JSON.parse(localStorage.getItem(KEY)||"null")||fresh()}catch(e){D=fresh()}D.shift=D.shift||fresh().shift;D.override=D.override||{};D.slotOverride=D.slotOverride||{};D.slots=D.slots||{};D.patientOverrides=D.patientOverrides||{};
let edit=null,drag=null,ghost=null;
function save(){localStorage.setItem(KEY,JSON.stringify(D))}
function norm(v){return String(v??"").trim().toLowerCase().replace(/\s+/g,"")}
function allPatients(){return PATIENTS.map(p=>({...p,...(D.patientOverrides[p.id]||{})}))}
function searchPatients(q){const raw=String(q??"").trim();if(!raw)return[];const A=allPatients();if(/^\d+$/.test(raw)){const p=A.find(x=>String(x.id)===raw);return p?[p]:[]}const n=norm(raw);return A.filter(p=>norm(p.name).includes(n)).slice(0,100)}
function label(t){return t==="care"?"介護":t==="bundle"?"まとめ":"一般"}
function effective(s){return D.override[s]||D.shift[s]||"normal"}
function baseState(s,t){const x=effective(s),h=parseInt(t,10);if(x==="full"||(x==="amoff"&&h<15)||(x==="pmoff"&&h>=15)||(x==="600"&&h>=18))return"closed";if(x==="phys"||(x==="physam"&&h<15)||(x==="physpm"&&h>=15))return"phys";return"normal"}
function state(s,t,k){return D.slotOverride[k]||baseState(s,t)}
function header(cls=""){return `<tr class="${cls}">${STAFF.slice(0,5).map(s=>`<th class="staffhead">${s}</th>`).join("")}<th class="timecol staffhead">時間</th>${STAFF.slice(5).map(s=>`<th class="staffhead">${s}</th>`).join("")}</tr>`}
function row(t){let cells=STAFF.map(s=>slotCell(s,t));return `<tr>${cells.slice(0,5).join("")}<td class="timecol">${t}</td>${cells.slice(5).join("")}</tr>`}
function slotCell(s,t){const k=t+"|"+s,st=state(s,t,k),x=D.slots[k],man=Object.prototype.hasOwnProperty.call(D.slotOverride,k);let body="";if(st==="closed")body='<div class="muted">閉鎖</div>';else if(st==="phys")body='<div class="muted">物療</div>';else if(x)body=`<div class="appt ${x.t}" data-src="slot" data-key="${k}" data-id="${x.id}"><div class="name">${x.name}</div><div class="muted">#${x.id} ${label(x.t)}</div></div>`;return `<td class="slot ${st==="closed"?"closed":st==="phys"?"phys":""} ${man?"manual":""}" data-key="${k}" data-staff="${s}" data-time="${t}" onclick="openSlot(event,this)">${body}</td>`}
function renderBoard(){document.getElementById("board").innerHTML=`<tbody>${header()}${AM.map(row).join("")}<tr class="sectiongap"><td colspan="13"></td></tr>${header("pmhead")}${PM.map(row).join("")}</tbody>`;bindDrag()}
function renderPatients(){const q=document.getElementById("search").value,m=searchPatients(q);document.getElementById("searchcount").textContent=q.trim()?`検索結果 ${m.length}件`:`登録患者 ${PATIENTS.length}名`;document.getElementById("plist").innerHTML=q.trim()?(m.length?m.map(p=>`<div class="pcard ${p.t}" data-src="patient" data-id="${p.id}"><b><span class="dot"></span>${p.name}</b><div class="muted">#${p.id} / ${label(p.t)}</div><div class="patient-actions"><button class="mini" onpointerdown="event.stopPropagation()" onclick="event.stopPropagation();openPatientSettings(\'${p.id}\')">患者設定</button></div></div>`).join(""):'<div class="muted">該当なし</div>'):'<div class="muted">患者番号または氏名を入力してください。</div>';bindDrag()}
function openSlot(e,td){if(e.target.closest(".appt"))return;edit={k:td.dataset.key,s:td.dataset.staff,t:td.dataset.time};const pop=document.getElementById("slotpop");document.getElementById("poptitle").textContent=edit.s+" "+edit.t;document.getElementById("popstate").textContent=`シフト由来：${stateLabel(baseState(edit.s,edit.t))} ／ 現在：${stateLabel(state(edit.s,edit.t,edit.k))}`;pop.classList.add("show");let r=td.getBoundingClientRect(),w=270,x=Math.min(window.innerWidth-w-8,Math.max(8,r.left)),y=r.bottom+6;if(y+245>window.innerHeight)y=Math.max(8,r.top-245);pop.style.left=x+"px";pop.style.top=y+"px"}
function stateLabel(x){return x==="closed"?"閉鎖":x==="phys"?"物療":"通常"}
function closePop(){document.getElementById("slotpop").classList.remove("show")}
document.addEventListener("pointerdown",e=>{if(!e.target.closest("#slotpop")&&!e.target.closest(".slot"))closePop()})
function slotAct(v){if(!edit)return;if(v==="base")delete D.slotOverride[edit.k];else D.slotOverride[edit.k]=v;save();closePop();renderBoard()}
function cancelBooking(){if(!edit)return;delete D.slots[edit.k];save();closePop();renderBoard()}
function openPatientPicker(){if(!edit)return;closePop();document.getElementById("psearch").value="";document.getElementById("picker").innerHTML='<div class="muted">患者番号または氏名を入力してください。</div>';document.getElementById("patientmodal").classList.add("show");setTimeout(()=>document.getElementById("psearch").focus(),50)}
function closePicker(){document.getElementById("patientmodal").classList.remove("show")}
function renderPicker(){const m=searchPatients(document.getElementById("psearch").value);document.getElementById("picker").innerHTML=m.length?m.map(p=>`<div class="result" onclick="book('${p.id}')"><b>${p.name}</b> <span class="muted">${label(p.t)}</span><div class="muted">患者番号 ${p.id}</div></div>`).join(""):'<div class="muted">該当する患者が見つかりません。</div>'}
function book(id){const p=allPatients().find(x=>x.id===id);if(!p||!edit)return;D.slots[edit.k]={id:p.id,name:p.name,t:p.t};D.slotOverride[edit.k]="normal";save();closePicker();renderBoard()}
function openPatientSettings(id){const p=allPatients().find(x=>x.id===id);if(!p)return;document.getElementById("ps-id").value=p.id;document.getElementById("ps-name").value=p.name;document.getElementById("ps-type").value=p.t;document.getElementById("patientsettings").classList.add("show")}
function closePatientSettings(){document.getElementById("patientsettings").classList.remove("show")}
function savePatientSettings(){const id=document.getElementById("ps-id").value,name=document.getElementById("ps-name").value.trim(),t=document.getElementById("ps-type").value;if(!id||!name)return alert("患者名を入力してください。");D.patientOverrides[id]={name,t};Object.values(D.slots).forEach(x=>{if(x&&x.id===id){x.name=name;x.t=t}});save();closePatientSettings();renderPatients();renderBoard()}
function desc(x){return{normal:"通常",full:"全日休み",amoff:"午前休み",pmoff:"午後休み","730":"730","715":"715","700":"700","600":"600（18時上がり）",phys:"終日物療",physam:"午前のみ物療",physpm:"午後のみ物療"}[x]||x}
function shiftVisual(v){if(v==="full")return'<span class="shiftmark full">■</span>';if(v==="amoff")return'<span class="shiftmark half">◤</span>';if(v==="pmoff")return'<span class="shiftmark half">◢</span>';if(["730","715","700","600"].includes(v))return`<span class="shiftmark code">${v}</span>`;return`<span class="shiftmark">${desc(v)}</span>`}
function renderShift(){document.getElementById("shiftdeck").innerHTML=STAFF.map(s=>{const v=D.shift[s]||"normal";return`<div class="shiftcell" data-staff="${s}"><div class="shiftpt">${s}</div>${shiftVisual(v)}<div class="shifthint">長押ししてフリック</div></div>`}).join("");bindShiftRadial()}
function setShift(s,v){D.shift[s]=v;delete D.override[s];save();renderShift();renderBoard()}
let radialSession=null,radialTimer=null,radialChoice=null;
const radialItems=["normal","730","715","700","600","pmoff","full","amoff"];
function bindShiftRadial(){document.querySelectorAll(".shiftcell").forEach(el=>{el.addEventListener("pointerdown",radialDown,{passive:false});el.addEventListener("contextmenu",e=>e.preventDefault())})}
function radialDown(e){if(e.pointerType==="mouse"&&e.button!==0)return;e.preventDefault();const el=e.currentTarget;radialSession={staff:el.dataset.staff,x:e.clientX,y:e.clientY,opened:false};radialTimer=setTimeout(()=>openRadial(radialSession.x,radialSession.y),180);document.addEventListener("pointermove",radialMove,{passive:false});document.addEventListener("pointerup",radialUp,{once:true,passive:false});document.addEventListener("pointercancel",radialCancel,{once:true,passive:false})}
function openRadial(x,y){if(!radialSession)return;radialSession.opened=true;const r=document.getElementById("radial"),mg=140;x=Math.max(mg,Math.min(innerWidth-mg,x));y=Math.max(mg,Math.min(innerHeight-mg,y));radialSession.cx=x;radialSession.cy=y;r.style.left=x+"px";r.style.top=y+"px";r.classList.add("show");radialChoice=null;updateRadial(null)}
function radialMove(e){if(!radialSession)return;e.preventDefault();if(!radialSession.opened){if(Math.hypot(e.clientX-radialSession.x,e.clientY-radialSession.y)>16){clearTimeout(radialTimer);openRadial(radialSession.x,radialSession.y)}else return}const dx=e.clientX-radialSession.cx,dy=e.clientY-radialSession.cy,dist=Math.hypot(dx,dy);if(dist<38){radialChoice=null;updateRadial(null);return}const deg=(Math.atan2(dx,-dy)*180/Math.PI+360)%360,idx=Math.round(deg/45)%8;radialChoice=radialItems[idx];updateRadial(radialChoice)}
function updateRadial(v){document.querySelectorAll("#radial .wedge").forEach(w=>w.classList.toggle("active",w.dataset.v===v));document.getElementById("radialcore").innerHTML=v?`<div>${shiftVisual(v)}<small>${desc(v)}</small></div>`:'<div>選択<small>FLICK</small></div>'}
function radialUp(e){clearTimeout(radialTimer);document.removeEventListener("pointermove",radialMove);if(radialSession&&radialSession.opened&&radialChoice)setShift(radialSession.staff,radialChoice);closeRadial()}
function radialCancel(){clearTimeout(radialTimer);document.removeEventListener("pointermove",radialMove);closeRadial()}
function closeRadial(){document.getElementById("radial").classList.remove("show");radialSession=null;radialChoice=null}
function showTab(x){document.getElementById("boardview").style.display=x==="board"?"block":"none";document.getElementById("shiftview").style.display=x==="shift"?"block":"none";document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===x));if(x==="shift")renderShift()}
function bindDrag(){
  document.querySelectorAll(".pcard,.appt").forEach(el=>{
    if(el.dataset.bound)return;
    el.dataset.bound="1";
    el.addEventListener("pointerdown",startDrag,{passive:false});
    el.addEventListener("dragstart",e=>e.preventDefault());
  })
}
function startDrag(e){
  if(e.pointerType==="mouse" && e.button!==0)return;
  e.preventDefault();
  e.stopPropagation();
  closePop();
  const el=e.currentTarget;
  drag={src:el.dataset.src,id:el.dataset.id,from:el.dataset.key||null,pointerId:e.pointerId};
  try{el.setPointerCapture(e.pointerId)}catch(_){}
  ghost=el.cloneNode(true);
  ghost.classList.add("dragghost");
  ghost.removeAttribute("onclick");
  document.body.appendChild(ghost);
  moveGhost(e);
  document.addEventListener("pointermove",dragMove,{passive:false});
  document.addEventListener("pointerup",dragEnd,{once:true,passive:false});
  document.addEventListener("pointercancel",dragCancel,{once:true,passive:false});
}
function moveGhost(e){
  if(ghost){
    ghost.style.left=e.clientX+"px";
    ghost.style.top=e.clientY+"px";
  }
}
function targetSlotAt(x,y){
  const el=document.elementFromPoint(x,y);
  return el&&el.closest?el.closest(".slot"):null;
}
function clearDrop(){
  document.querySelectorAll(".slot.drop").forEach(x=>x.classList.remove("drop"));
}
function dragMove(e){
  if(!drag)return;
  e.preventDefault();
  moveGhost(e);
  clearDrop();
  const s=targetSlotAt(e.clientX,e.clientY);
  if(s && state(s.dataset.staff,s.dataset.time,s.dataset.key)==="normal"){
    s.classList.add("drop");
  }
}
function finishDragVisual(){
  clearDrop();
  if(ghost)ghost.remove();
  ghost=null;
}
function dragCancel(e){
  document.removeEventListener("pointermove",dragMove);
  finishDragVisual();
  drag=null;
}
function dragEnd(e){
  if(!drag)return;
  e.preventDefault();
  document.removeEventListener("pointermove",dragMove);
  const s=targetSlotAt(e.clientX,e.clientY);
  const currentDrag=drag;
  finishDragVisual();
  drag=currentDrag;
  if(s){
    const st=state(s.dataset.staff,s.dataset.time,s.dataset.key);
    if(st==="normal")dropTo(s.dataset.key);
    else if(st==="closed")alert("この枠は閉鎖中のため予約できません。");
    else if(st==="phys")alert("この枠は物療枠のため直接予約できません。");
  }
  drag=null;
}
function dropTo(k){
  if(!drag)return;
  if(drag.src==="slot" && drag.from===k)return;
  let item;
  if(drag.src==="patient"){
    const p=allPatients().find(x=>x.id===drag.id);
    if(!p)return;
    item={id:p.id,name:p.name,t:p.t};
  }else{
    item=D.slots[drag.from];
  }
  if(!item)return;

  if(D.slots[k] && k!==drag.from && !confirm("予約済みです。入れ替えますか？"))return;

  if(drag.src==="slot" && drag.from!==k){
    const old=D.slots[k];
    delete D.slots[drag.from];
    D.slots[k]=item;
    if(old)D.slots[drag.from]=old;
  }else{
    D.slots[k]=item;
  }
  save();
  renderBoard();
}renderBoard()
renderBoard();renderPatients();renderShift();
</script></body></html>
