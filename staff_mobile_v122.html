<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png"><title>柴田屋OZ モバイル</title>
<style>
:root{--ink:#17324b;--muted:#718395;--blue:#1478e8;--sky:#42c6eb;--line:#dce8f1;--yellow:#fff36b;--red:#d6424d}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--ink);background:linear-gradient(#f7fcff,#fff);padding-bottom:82px}
header{position:sticky;top:0;z-index:20;background:#fffffff2;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:10px 12px}.brand{display:flex;align-items:center;gap:9px;font-weight:950}.logo{width:38px;height:38px;object-fit:contain;border-radius:50%;box-shadow:0 0 0 6px #eaf6ff}.small{font-size:12px;color:var(--muted)}
main{padding:10px;max-width:700px;margin:auto}.datebar,.tabs,.staffs{display:flex;gap:7px;overflow:auto;scrollbar-width:none}.datebar button,.tabs button,.staffs button,.btn{border:0;border-radius:13px;padding:10px 13px;font-weight:900;background:#edf4f9;color:var(--ink);white-space:nowrap}.tabs button.on,.staffs button.on{background:linear-gradient(135deg,var(--blue),var(--sky));color:white}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:13px;margin:10px 0;box-shadow:0 8px 25px #1b658b0b}
.sectiontitle{display:flex;justify-content:space-between;align-items:center;margin:14px 3px 7px}.sectiontitle b{font-size:17px}.slot{display:grid;grid-template-columns:58px 1fr 28px;gap:8px;align-items:center;min-height:58px;border-top:1px solid #edf2f6;padding:7px 2px}.slot:first-child{border-top:0}.time{font-weight:950;color:#0e64b4}.box{min-height:43px;border-radius:13px;padding:7px 10px;background:#f7fafc;border:1px solid #edf1f4}.box.empty{color:#9aa9b5}.box.closed{background:repeating-linear-gradient(45deg,#f8fafb,#f8fafb 8px,#74838f 9px,#74838f 11px);color:#243441;font-weight:900}.box.phys{background:var(--yellow);font-weight:900}.name{font-weight:950}.care{color:#176bd4}.bundle{color:var(--red)}.borrow{color:#a27b00}.chev{font-size:22px;color:#9aabb8}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fffffff4;backdrop-filter:blur(15px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:7px max(8px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}.bottom button{border:0;background:none;padding:7px;font-weight:900;color:#6f8292}.bottom button.on{color:var(--blue)}
.modalbg{display:none;position:fixed;inset:0;background:#10253699;z-index:50;align-items:flex-end}.modalbg.show{display:flex}.sheet{width:100%;max-height:88vh;overflow:auto;background:white;border-radius:24px 24px 0 0;padding:17px 15px calc(20px + env(safe-area-inset-bottom))}.handle{width:44px;height:5px;border-radius:99px;background:#d9e2e8;margin:0 auto 14px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice button{padding:14px 8px;border:1px solid var(--line);border-radius:14px;background:#f7fafc;font-weight:900}.choice .yellow{background:var(--yellow)}.choice .danger{background:#f3f4f5}.search{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;font:inherit}.result{padding:12px;border-bottom:1px solid #edf2f6}.result:last-child{border-bottom:0}.badge{font-size:11px;border-radius:99px;background:#eef4f8;padding:4px 7px}.shiftrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #edf2f6}.shiftrow select{max-width:190px;padding:9px;border:1px solid var(--line);border-radius:11px;background:white}
</style></head>
<body><header><div class="brand"><img class="logo" src="shibataya-emblem.png"><div>柴田屋整形外科<div class="small">OZ MOBILE v1.2.2</div></div></div></header>
<main>
<div class="card"><div class="datebar"><button>‹ 前日</button><button style="background:#1478e8;color:#fff">10月1日（木）</button><button>翌日 ›</button></div></div>
<div id="ptview"><div class="tabs"><button class="on">PT別</button><button onclick="location.href='staff_schedule_v11.html'">全体予約表</button></div><div class="card"><div class="small">担当PT</div><div id="staffs" class="staffs"></div></div><div id="schedule"></div></div>
<div id="shiftview" style="display:none"><div class="card"><h2 style="margin-top:0">今日のシフト</h2><div id="shiftlist"></div></div></div>
<div id="searchview" style="display:none"><div class="card"><h2 style="margin-top:0">患者検索</h2><input id="search" class="search" placeholder="患者名 / 患者番号" oninput="renderSearch()"><div id="results"></div></div></div>
</main>
<nav class="bottom"><button id="navpt" class="on" onclick="view('pt')">▦<br>予約</button><button id="navsearch" onclick="view('search')">⌕<br>患者</button><button id="navshift" onclick="view('shift')">◫<br>シフト</button></nav>
<div id="modal" class="modalbg" onclick="if(event.target===this)closeM()"><div class="sheet"><div class="handle"></div><h3 id="mtitle"></h3><div id="mstatus" class="small"></div><div class="small" style="margin-top:5px;color:#ff7b00">変更後は一覧へ即時反映されます</div><div style="height:12px"></div><div class="choice"><button onclick="choosePatient()">＋ 患者を予約</button><button class="yellow" onclick="slotAct('phys')">🟨 物療にする</button><button class="danger" onclick="slotAct('closed')">▧ 枠を閉じる</button><button onclick="slotAct('normal')">○ 通常枠にする</button><button onclick="slotAct('base')" style="grid-column:1/-1">シフト設定に戻す</button></div></div></div>
<div id="patientmodal" class="modalbg" onclick="if(event.target===this)this.classList.remove('show')"><div class="sheet"><div class="handle"></div><h3>この枠に予約</h3><input id="psearch" class="search" placeholder="患者名 / 患者番号" oninput="renderPicker()"><div id="picker"></div></div></div>
<script>
const STAFF=["本院","山口","竹谷","赤尾","中西","釆野","増田","都築","伊藤","長谷川","山梨","松田"];
const AM=["09:00","09:20","09:40","10:00","10:20","10:40","11:00","11:20","11:40","12:00"],PM=["15:00","15:20","15:40","16:00","16:20","16:40","17:00","17:20","17:40","18:00","18:20","18:40","19:00"];
const P=[{id:"10012",name:"天塚 文隆",t:"general"},{id:"10021",name:"加藤 花子",t:"bundle"},{id:"10046",name:"山口 一郎",t:"care"},{id:"10056",name:"伊藤 美咲",t:"general"}];
const KEY="shibataya_v11";let D=JSON.parse(localStorage.getItem(KEY)||"null")||{date:"2026-10-01",shift:{},override:{},slotOverride:{},slots:{}};if(!D.slotOverride)D.slotOverride={};if(!Object.keys(D.shift||{}).length){D.shift={};STAFF.forEach(s=>D.shift[s]="normal");D.shift["本院"]="phys";D.shift["松田"]="full"}if(!D.override)D.override={};if(!D.slots)D.slots={};
let current="山口",edit=null;
function save(){localStorage.setItem(KEY,JSON.stringify(D))}
function eff(s){return D.override[s]||D.shift[s]||"normal"}function closed(s,t){let x=eff(s),h=parseInt(t);return x==="full"||(x==="amoff"&&h<15)||(x==="pmoff"&&h>=15)||(x==="600"&&h>=18)}function phys(s,t){let x=eff(s),h=parseInt(t);return x==="phys"||(x==="physam"&&h<15)||(x==="physpm"&&h>=15)}function base(s,t){return closed(s,t)?"closed":phys(s,t)?"phys":"normal"}function state(s,t){return D.slotOverride[t+"|"+s]||base(s,t)}
function renderStaffs(){document.getElementById("staffs").innerHTML=STAFF.map(s=>`<button class="${s===current?"on":""}" onclick="current='${s}';renderStaffs();renderSchedule()">${s}</button>`).join("")}
function label(t){return t==="care"?"介護":t==="bundle"?"まとめ":"一般"}function block(title,a){return `<div class="sectiontitle"><b>${title}</b><span class="small">${current}</span></div><div class="card">${a.map(t=>slot(t)).join("")}</div>`}
function slot(t){let k=t+"|"+current,st=state(current,t),x=D.slots[k],ov=D.slotOverride[k],body=st==="closed"?`<div class="box closed">閉鎖</div>`:st==="phys"?`<div class="box phys">物療担当・予約不可</div>`:x?`<div class="box"><div class="name ${x.t}">${x.name}${x.borrow?` <span class="borrow">(${x.borrow})</span>`:""}</div><div class="small">#${x.id} / ${label(x.t)}</div></div>`:`<div class="box empty">空き</div>`;return `<div class="slot" onclick="openSlot('${t}')"><div class="time">${t}${ov?`<div style="font-size:9px;color:#ff7b00">手動</div>`:""}</div>${body}<div class="chev">›</div></div>`}
function renderSchedule(){document.getElementById("schedule").innerHTML=block("午前",AM)+block("午後",PM)}
function openSlot(t){edit={s:current,t,k:t+"|"+current};document.getElementById("mtitle").textContent=current+" "+t;let b=base(current,t);document.getElementById("mstatus").textContent="シフト由来："+(b==="closed"?"閉鎖":b==="phys"?"物療":"通常")+" ／ 現在："+({closed:"閉鎖",phys:"物療",normal:"通常"}[state(current,t)]);document.getElementById("modal").classList.add("show")}
function closeM(){document.getElementById("modal").classList.remove("show")}function slotAct(v){
 if(!edit)return;
 if(v==="normal"&&base(edit.s,edit.t)!=="normal"&&!confirm("シフト設定をこの20分だけ上書きして開放しますか？"))return;
 if(v==="base"){delete D.slotOverride[edit.k];}
 else{D.slotOverride[edit.k]=v;}
 save();
 closeM();
 renderSchedule();
 setTimeout(renderSchedule,0);
}
function choosePatient(){closeM();document.getElementById("psearch").value="";renderPicker();document.getElementById("patientmodal").classList.add("show")}
function renderPicker(){let q=document.getElementById("psearch").value.toLowerCase();document.getElementById("picker").innerHTML=P.filter(p=>!q||p.name.toLowerCase().includes(q)||p.id.includes(q)).map(p=>`<div class="result" onclick="book('${p.id}')"><b>${p.name}</b> <span class="badge">${label(p.t)}</span><div class="small">患者番号 ${p.id}</div></div>`).join("")}
function book(id){let p=P.find(x=>x.id===id);D.slots[edit.k]={id:p.id,name:p.name,t:p.t};D.slotOverride[edit.k]="normal";save();document.getElementById("patientmodal").classList.remove("show");renderSchedule()}
function renderSearch(){let q=document.getElementById("search").value.toLowerCase();document.getElementById("results").innerHTML=P.filter(p=>!q||p.name.toLowerCase().includes(q)||p.id.includes(q)).map(p=>`<div class="result"><b>${p.name}</b> <span class="badge">${label(p.t)}</span><div class="small">#${p.id}</div></div>`).join("")}
function desc(x){return {normal:"通常",full:"全日休み",amoff:"午前休み",pmoff:"午後休み","600":"18時上がり",phys:"終日物療",physam:"午前物療",physpm:"午後物療"}[x]||x}
function renderShift(){document.getElementById("shiftlist").innerHTML=STAFF.map(s=>`<div class="shiftrow"><b>${s}</b><select onchange="D.override['${s}']=this.value==='base'?undefined:this.value;if(this.value==='base')delete D.override['${s}'];save();renderSchedule()"><option value="base">シフト：${desc(D.shift[s]||"normal")}</option><option value="normal">通常</option><option value="full">全日休み</option><option value="amoff">午前休み</option><option value="pmoff">午後休み</option><option value="600">18時上がり</option><option value="phys">終日物療</option><option value="physam">午前物療</option><option value="physpm">午後物療</option></select></div>`).join("")}
function view(v){["pt","search","shift"].forEach(x=>{document.getElementById(x+"view").style.display=x===v?"block":"none";document.getElementById("nav"+x).classList.toggle("on",x===v)});if(v==="shift")renderShift();if(v==="search")renderSearch()}
renderStaffs();renderSchedule();
</script></body></html>
